spring:
  application:
    name: framingham-risk-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/framingham}
    username: ${DB_USERNAME:framingham}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    # Keycloak's signing keys, fetched directly (compose: http://keycloak:8080/...).
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/auth/realms/framingham/protocol/openid-connect/certs}
    # The issuer's host depends on how the browser reached Keycloak (localhost, tunnel),
    # so only its path is checked; the signature proves the token came from our Keycloak.
    issuer-path: /auth/realms/framingham
    audience: framingham-api
