# Local development/testing. docker compose up is NOT a Swarm deployment.
services:
  database:
    image: postgres:16.10-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: framingham
      POSTGRES_USER: framingham
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Create a .env file with DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      - framingham_pgdata:/var/lib/postgresql/data
      # Creates the keycloak database, only when the volume is new.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U framingham -d framingham" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ internal ]

  backend:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://database:5432/framingham
      DB_USERNAME: framingham
      DB_PASSWORD: ${DB_PASSWORD:?Create a .env file with DB_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      database:
        condition: service_healthy
    networks: [ internal ]

  keycloak:
    build: ./keycloak
    restart: unless-stopped
    ports:
      # Admin console only (http://localhost:8180/auth/admin); users come through Nginx /auth/.
      - "127.0.0.1:8180:8080"
    environment:
      KC_DB_URL: jdbc:postgresql://database:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      # Plain HTTP behind the proxy; the public host and scheme come from X-Forwarded-*,
      # so the same setup works on localhost and behind a changing tunnel URL.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
    healthcheck:
      # The image has no curl: ask the management port directly.
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      database:
        condition: service_healthy
    networks: [ internal ]

  frontend:
    build: ../framingham-risk-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    environment:
      BACKEND_URL: ${FRONTEND_BACKEND_URL:-http://backend:8080}
      KEYCLOAK_URL: http://keycloak:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks: [ internal ]

networks:
  internal:

volumes:
  framingham_pgdata:
