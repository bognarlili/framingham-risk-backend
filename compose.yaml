# Local development/testing. docker compose up is NOT a Swarm deployment.
services:
  database:
    image: postgres:16.10-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: framingham
      POSTGRES_USER: framingham
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Create a .env file with DB_PASSWORD}
    volumes:
      - framingham_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U framingham -d framingham" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ internal ]

  backend:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://database:5432/framingham
      DB_USERNAME: framingham
      DB_PASSWORD: ${DB_PASSWORD:?Create a .env file with DB_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      database:
        condition: service_healthy
    networks: [ internal ]

networks:
  internal:

volumes:
  framingham_pgdata:
